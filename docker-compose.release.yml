services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  app:
    image: ghcr.io/shargabong/taskboard:v0.1.0
    environment:
      TASKBOARD_ENVIRONMENT: production
      TASKBOARD_SECRET_KEY: change-me-before-real-use
      TASKBOARD_DATABASE_URL: postgresql+psycopg://taskboard:taskboard@db:5432/taskboard
      TASKBOARD_SESSION_HTTPS_ONLY: "false"
      TASKBOARD_SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
