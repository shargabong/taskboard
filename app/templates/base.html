<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TaskBoard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">TaskBoard</a>
    {% if user %}
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="/tasks">Задачи</a>
        <a class="nav-link" href="/tasks/new">Новая задача</a>
        {% if user.role.value == 'admin' %}
          <a class="nav-link" href="/admin/users">Пользователи</a>
        {% endif %}
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 small">{{ user.full_name }}</span>
        <a class="btn btn-outline-light btn-sm" href="/logout">Выйти</a>
      </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% if flash %}
    <div class="alert alert-{{ flash.kind }} alert-dismissible fade show" role="alert">
      {{ flash.message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
