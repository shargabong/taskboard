{% extends "base.html" %}
{% block title %}Новая задача{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Новая задача</h1>
        <form method="post" action="/tasks/new">
          <div class="mb-3">
            <label class="form-label" for="title">Название</label>
            <input class="form-control" id="title" name="title" required maxlength="200">
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Описание</label>
            <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="priority">Приоритет</label>
              <select class="form-select" id="priority" name="priority">
                {% for item in Priority %}
                  <option value="{{ item.value }}" {% if item == Priority.normal %}selected{% endif %}>{{ priority_labels[item] }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="assignee_id">Исполнитель</label>
              <select class="form-select" id="assignee_id" name="assignee_id">
                {% if user.role.value == 'employee' %}
                  <option value="{{ user.id }}">{{ user.full_name }}</option>
                {% else %}
                  <option value="">Не назначен</option>
                  {% for item in assignees %}
                    <option value="{{ item.id }}">{{ item.full_name }}</option>
                  {% endfor %}
                {% endif %}
              </select>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Создать</button>
            <a class="btn btn-outline-secondary" href="/tasks">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
